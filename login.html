<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <h1>Admin sign in</h1>
    <p class="sub">Sign in to upload, edit, or remove work.</p>
    <form id="login-form">
      <label for="email-input">Email</label>
      <input type="email" id="email-input" placeholder="Enter your email" required autocomplete="username" />
      <label for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="Enter your password" required autocomplete="current-password" />
      <div class="form-msg" id="login-msg"></div>
      <button class="btn" type="submit" id="login-submit">Sign in</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
